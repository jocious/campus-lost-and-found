
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Lost and Found</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1>Campus Lost and Found</h1>
        <p>Report lost items and help return found belongings to their owners.</p>
    </header>

    <main class="main-container">

        <!-- Summary cards display the total number of reports in each status. -->
        <section class="summary-section">
            <h2>Report Summary</h2>

            <div class="summary-grid">
                <article class="summary-card lost-summary">
                    <h3>Lost Items</h3>
                    <p id="lostCount">0</p>
                </article>

                <article class="summary-card found-summary">
                    <h3>Found Items</h3>
                    <p id="foundCount">0</p>
                </article>

                <article class="summary-card returned-summary">
                    <h3>Returned Items</h3>
                    <p id="returnedCount">0</p>
                </article>
            </div>
        </section>

        <!-- This form is used to add new reports and edit existing reports. -->
        <section class="form-section">
            <h2 id="formTitle">Submit a Report</h2>

            <form id="itemForm">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input
                        type="text"
                        id="itemName"
                        placeholder="Example: Black wallet"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="itemStatus">Report Status</label>
                    <select id="itemStatus" required>
                        <option value="Lost">Lost</option>
                        <option value="Found">Found</option>
                        <option value="Returned">Returned</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="itemDescription">Description</label>
                    <textarea
                        id="itemDescription"
                        placeholder="Describe the item"
                        rows="3"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="itemLocation">Location</label>
                    <input
                        type="text"
                        id="itemLocation"
                        placeholder="Example: Library"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reporterName">Reporter Name</label>
                    <input
                        type="text"
                        id="reporterName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contactNumber">Contact Number</label>
                    <input
                        type="tel"
                        id="contactNumber"
                        placeholder="Example: 09123456789"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reportDate">Report Date</label>
                    <input type="date" id="reportDate" required>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitButton">Submit Report</button>

                    <button
                        type="button"
                        id="cancelEditButton"
                        class="cancel-button"
                        hidden
                    >
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <!-- Search, filter, and sorting controls from earlier commits. -->
        <section class="reports-section">
            <h2>Lost and Found Reports</h2>

            <div class="filter-grid">
                <div class="form-group">
                    <label for="searchInput">Search Reports</label>
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search name, location, description..."
                    >
                </div>

                <div class="form-group">
                    <label for="filterStatus">Filter by Status</label>
                    <select id="filterStatus">
                        <option value="All">All Statuses</option>
                        <option value="Lost">Lost</option>
                        <option value="Found">Found</option>
                        <option value="Returned">Returned</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="filterDate">Filter by Date</label>
                    <select id="filterDate">
                        <option value="all">All Dates</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sortReports">Sort Reports</label>
                    <select id="sortReports">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="name">Item Name (A–Z)</option>
                    </select>
                </div>
            </div>

            <div class="filter-actions">
                <button
                    type="button"
                    id="resetFiltersButton"
                    class="reset-button"
                >
                    Reset Filters
                </button>

                <p id="resultCount" aria-live="polite">0 reports found</p>
            </div>

            <!-- JavaScript inserts report cards here. -->
            <div id="itemsContainer" class="items-container"></div>
        </section>
    </main>

    <footer class="page-footer">
        <p>Campus Lost and Found System</p>
    </footer>
</body>
</html>
