
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Sets the character encoding so text displays correctly. -->
    <meta charset="UTF-8">

    <!-- Makes the layout adjust to desktop, tablet, and mobile screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the title shown in the browser tab. -->
    <title>Campus Lost and Found</title>

    <!-- Connects this HTML file to the CSS design file. -->
    <link rel="stylesheet" href="style.css">

    <!-- Loads JavaScript after the HTML has been parsed. -->
    <script src="script.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1>Campus Lost and Found</h1>
        <p>Report lost items and help return found belongings to their owners.</p>
    </header>

    <main class="main-container">
        <!-- Report form: used for both adding and editing reports. -->
        <section class="form-section">
            <h2 id="formTitle">Submit a Report</h2>

            <form id="itemForm">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input
                        type="text"
                        id="itemName"
                        placeholder="Example: Black wallet"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="itemStatus">Report Status</label>
                    <select id="itemStatus" required>
                        <option value="Lost">Lost</option>
                        <option value="Found">Found</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="itemDescription">Description</label>
                    <textarea
                        id="itemDescription"
                        placeholder="Describe the item"
                        rows="3"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="itemLocation">Location</label>
                    <input
                        type="text"
                        id="itemLocation"
                        placeholder="Example: Library"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reporterName">Reporter Name</label>
                    <input
                        type="text"
                        id="reporterName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contactNumber">Contact Number</label>
                    <input
                        type="tel"
                        id="contactNumber"
                        placeholder="Example: 09123456789"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reportDate">Report Date</label>
                    <input type="date" id="reportDate" required>
                </div>

                <!-- The same submit button adds or updates, depending on the form mode. -->
                <div class="form-actions">
                    <button type="submit" id="submitButton">Submit Report</button>

                    <!-- Hidden until the user starts editing a report. -->
                    <button
                        type="button"
                        id="cancelEditButton"
                        class="cancel-button"
                        hidden
                    >
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <!-- Search and filtering controls from Commit 2. -->
        <section class="reports-section">
            <h2>Lost and Found Reports</h2>

            <div class="filter-grid">
                <div class="form-group">
                    <label for="searchInput">Search Reports</label>
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search name, location, description..."
                    >
                </div>

                <div class="form-group">
                    <label for="filterStatus">Filter by Status</label>
                    <select id="filterStatus">
                        <option value="All">All Statuses</option>
                        <option value="Lost">Lost</option>
                        <option value="Found">Found</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="filterDate">Filter by Date</label>
                    <select id="filterDate">
                        <option value="all">All Dates</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sortReports">Sort Reports</label>
                    <select id="sortReports">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="name">Item Name (A–Z)</option>
                    </select>
                </div>
            </div>

            <div class="filter-actions">
                <button type="button" id="resetFiltersButton" class="reset-button">
                    Reset Filters
                </button>

                <p id="resultCount" aria-live="polite">0 reports found</p>
            </div>

            <!-- JavaScript displays the saved reports inside this container. -->
            <div id="itemsContainer" class="items-container"></div>
        </section>
    </main>

    <footer class="page-footer">
        <p>Campus Lost and Found System</p>
    </footer>
</body>
</html>
